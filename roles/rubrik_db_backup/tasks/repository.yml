---
# Created by Adam Spandel, October 2026
# Purpose: Deploys and configures the Rubrik database backup repository.
# Temporarily decrypts the Vault-protected GitHub deployment key, uses it
# to clone or update the backup repository, and removes it afterwards.

- name: Ensure Rubrik backup user SSH directory exists
  ansible.builtin.file:
    path: "/home/{{ rubrik_db_backup_user }}/.ssh"
    state: directory
    owner: "{{ rubrik_db_backup_user }}"
    group: "{{ rubrik_db_backup_user }}"
    mode: "0700"

- name: Ensure Rubrik backup user Ansible temporary directory exists
  ansible.builtin.file:
    path: "/home/{{ rubrik_db_backup_user }}/.ansible/tmp"
    state: directory
    owner: "{{ rubrik_db_backup_user }}"
    group: "{{ rubrik_db_backup_user }}"
    mode: "0700"

- name: Deploy Rubrik backup repository
  block:
    - name: Deploy temporary GitHub deployment key
      ansible.builtin.copy:
        src: ansible_github_id_rsa
        dest: "/home/{{ rubrik_db_backup_user }}/.ssh/rubrik_backup_deployment.key"
        owner: "{{ rubrik_db_backup_user }}"
        group: "{{ rubrik_db_backup_user }}"
        mode: "0600"
        decrypt: true
      no_log: true

    - name: Clone or update Rubrik backup repository
      ansible.builtin.git:
        repo: "{{ rubrik_db_backup_repo_address }}"
        dest: "{{ rubrik_db_backup_repo_path }}"
        version: "{{ rubrik_db_backup_repo_version }}"
        key_file: >-
          /home/{{ rubrik_db_backup_user }}/.ssh/rubrik_backup_deployment.key
        accept_hostkey: true
        clone: true
        update: true
        force: true
      become: true
      become_user: "{{ rubrik_db_backup_user }}"
      register: rubrik_db_backup_repository_result

  always:
    - name: Remove temporary GitHub deployment key
      ansible.builtin.file:
        path: >-
          /home/{{ rubrik_db_backup_user }}/.ssh/rubrik_backup_deployment.key
        state: absent
      no_log: true

- name: Deploy Rubrik backup configuration
  ansible.builtin.template:
    src: config_backup.py.j2
    dest: "{{ rubrik_db_backup_config_path }}"
    owner: "{{ rubrik_db_backup_user }}"
    group: "{{ rubrik_db_backup_user }}"
    mode: "0600"
  no_log: true

- name: Set Rubrik backup repository ownership
  ansible.builtin.file:
    path: "{{ rubrik_db_backup_repo_path }}"
    state: directory
    owner: "{{ rubrik_db_backup_user }}"
    group: "{{ rubrik_db_backup_user }}"
    mode: "0700"
    recurse: true

- name: Grant Splunk read access to Rubrik backup repository
  ansible.posix.acl:
    path: "{{ rubrik_db_backup_repo_path }}"

- name: Protect Rubrik backup configuration permissions
  ansible.builtin.file:
    path: "{{ rubrik_db_backup_config_path }}"
    owner: "{{ rubrik_db_backup_user }}"
    group: "{{ rubrik_db_backup_user }}"
    mode: "0600"
    state: file

- name: Remove Splunk ACL from Rubrik backup configuration
  ansible.posix.acl:
    path: "{{ rubrik_db_backup_config_path }}"
    entity: splunk
    etype: user
    state: absent
