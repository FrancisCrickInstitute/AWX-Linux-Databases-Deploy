---
# Created by Adam Spandel, October 2026
# Purpose: Creates or locates the Rubrik Managed Volume used for database
# backups. Authenticates to Rubrik Security Cloud, checks whether the
# Managed Volume exists, creates it when required, and applies the
# environment-specific SLA.

- name: Probe Rubrik token endpoint
  ansible.builtin.uri:
    url: "{{ rubrik_db_backup_api_url }}/client_token"
    method: POST
    body_format: json
    body: {}
    return_content: true
    status_code:
      - 400
  register: rubrik_db_backup_token_probe
  changed_when: false

- name: Validate Rubrik token endpoint
  ansible.builtin.assert:
    that:
      - rubrik_db_backup_token_probe.status | int == 400
    fail_msg: >-
      Rubrik token endpoint probe returned HTTP
      {{ rubrik_db_backup_token_probe.status | default("unavailable") }}
      instead of the expected HTTP 400.
    success_msg: >-
      Rubrik token endpoint is reachable and responded with the expected
      HTTP 400 to an empty authentication request.

- name: Obtain Rubrik API bearer token
  ansible.builtin.uri:
    url: "{{ rubrik_db_backup_api_url }}/client_token"
    method: POST
    body_format: form-urlencoded
    body:
      client_id: "{{ rubrik_db_backup_service_account_id }}"
      client_secret: "{{ rubrik_db_backup_service_account_secret }}"
      grant_type: client_credentials
    return_content: true
    status_code:
      - 200
      - 201
      - 400
      - 401
      - 403
      - 404
  register: rubrik_db_backup_token_response
  failed_when: false
  no_log: true

- name: Validate Rubrik API authentication
  ansible.builtin.assert:
    that:
      - rubrik_db_backup_token_response.status | int in [200, 201]
      - rubrik_db_backup_token_response.json is defined
      - rubrik_db_backup_token_response.json.access_token is defined
      - rubrik_db_backup_token_response.json.access_token | length > 0
    fail_msg: >-
      Rubrik API authentication failed.
      HTTP status:
      {{
        rubrik_db_backup_token_response.status
        | default("unavailable")
      }}.
      Connection message:
      {{
        rubrik_db_backup_token_response.msg
        | default("not supplied")
      }}.
    success_msg: "Rubrik API authentication succeeded."

- name: Record Rubrik API bearer token
  ansible.builtin.set_fact:
    rubrik_db_backup_bearer_token: >-
      Bearer {{ rubrik_db_backup_token_response.json.access_token }}
  no_log: true

- name: Search for existing Rubrik Managed Volume
  ansible.builtin.uri:
    url: "{{ rubrik_db_backup_api_url }}/graphql"
    method: POST
    headers:
      Authorization: "{{ rubrik_db_backup_bearer_token }}"
    body_format: json
    body:
      query: |
        query retrieveMVId($mv_name: [String!]) {
          managedVolumes(
            filter: [
              {
                field: NAME_EXACT_MATCH,
                texts: $mv_name
              }
            ]
          ) {
            nodes {
              id
            }
          }
        }
      variables:
        mv_name:
          - "{{ rubrik_db_backup_mv_name }}"
    return_content: true
    status_code: 200
  register: rubrik_db_backup_mv_search
  no_log: true

- name: Record existing Rubrik Managed Volume ID
  ansible.builtin.set_fact:
    rubrik_db_backup_mv_id: >-
      {{
        rubrik_db_backup_mv_search
        .json.data.managedVolumes.nodes[0].id
      }}
  when:
    - >-
      rubrik_db_backup_mv_search
      .json.data.managedVolumes.nodes | length > 0

- name: Create Rubrik Managed Volume
  ansible.builtin.uri:
    url: "{{ rubrik_db_backup_api_url }}/graphql"
    method: POST
    headers:
      Authorization: "{{ rubrik_db_backup_bearer_token }}"
    body_format: json
    body:
      query: |
        mutation createMV(
          $mv_config: ManagedVolumeConfigInput!
        ) {
          addManagedVolume(
            input: {
              clusterUuid: "{{ rubrik_db_backup_cluster_uuid }}",
              managedVolumeConfig: $mv_config
            }
          ) {
            managedVolumeSummary {
              applicationTag
              numChannels
              volumeSize
              hostPatterns
              shareType
            }
          }
        }
      variables:
        mv_config:
          name: "{{ rubrik_db_backup_mv_name }}"
          applicationTag: "{{ rubrik_db_backup_application_tag }}"
          numChannels: 1
          volumeSize: "{{ rubrik_db_backup_volume_size | int }}"
          exportConfig:
            shareType: MANAGED_VOLUME_SHARE_TYPE_NFS
            managedVolumePatchConfig:
              hostPatterns:
                - "{{ ansible_default_ipv4.address }}"
    return_content: true
  register: rubrik_db_backup_mv_create
  when: rubrik_db_backup_mv_id is not defined
  failed_when: false
  changed_when: false
  no_log: true

- name: Prepare Rubrik Managed Volume creation diagnostic
  ansible.builtin.set_fact:
    rubrik_db_backup_mv_create_diagnostic:
      status: >-
        {{
          rubrik_db_backup_mv_create.status
          | default("unavailable")
        }}
      message: >-
        {{
          rubrik_db_backup_mv_create.msg
          | default("not supplied")
          | replace(
              rubrik_db_backup_bearer_token,
              "[REDACTED]"
            )
          | replace(
              rubrik_db_backup_service_account_id,
              "[REDACTED]"
            )
          | replace(
              rubrik_db_backup_service_account_secret,
              "[REDACTED]"
            )
        }}
      content: >-
        {{
          rubrik_db_backup_mv_create.content
          | default("not supplied")
          | replace(
              rubrik_db_backup_bearer_token,
              "[REDACTED]"
            )
          | replace(
              rubrik_db_backup_service_account_id,
              "[REDACTED]"
            )
          | replace(
              rubrik_db_backup_service_account_secret,
              "[REDACTED]"
            )
        }}
      graphql_errors: >-
        {{
          rubrik_db_backup_mv_create.json.errors
          | default("No GraphQL error details returned")
        }}
  when: rubrik_db_backup_mv_id is not defined
  no_log: true

- name: Validate Rubrik Managed Volume creation
  ansible.builtin.assert:
    that:
      - rubrik_db_backup_mv_create.status | int == 200
      - rubrik_db_backup_mv_create.json is defined
      - rubrik_db_backup_mv_create.json.errors is not defined
      - rubrik_db_backup_mv_create.json.data is defined
      - rubrik_db_backup_mv_create.json.data.addManagedVolume is defined
    fail_msg: >-
      Rubrik Managed Volume creation failed.
      HTTP status:
      {{ rubrik_db_backup_mv_create_diagnostic.status }}.
      HTTP message:
      {{ rubrik_db_backup_mv_create_diagnostic.message }}.
      GraphQL errors:
      {{ rubrik_db_backup_mv_create_diagnostic.graphql_errors }}.
      Response content:
      {{ rubrik_db_backup_mv_create_diagnostic.content }}.
    success_msg: >-
      Rubrik Managed Volume creation request succeeded.
  when: rubrik_db_backup_mv_id is not defined

- name: Record Rubrik Managed Volume creation
  ansible.builtin.set_fact:
    rubrik_db_backup_mv_created: true
  when:
    - rubrik_db_backup_mv_id is not defined
    - rubrik_db_backup_mv_create.status | int == 200
    - rubrik_db_backup_mv_create.json is defined
    - rubrik_db_backup_mv_create.json.errors is not defined
    - rubrik_db_backup_mv_create.json.data is defined
    - rubrik_db_backup_mv_create.json.data.addManagedVolume is defined

- name: Retrieve newly created Rubrik Managed Volume
  ansible.builtin.uri:
    url: "{{ rubrik_db_backup_api_url }}/graphql"
    method: POST
    headers:
      Authorization: "{{ rubrik_db_backup_bearer_token }}"
    body_format: json
    body:
      query: |
        query retrieveMVId($mv_name: [String!]) {
          managedVolumes(
            filter: [
              {
                field: NAME_EXACT_MATCH,
                texts: $mv_name
              }
            ]
          ) {
            nodes {
              id
            }
          }
        }
      variables:
        mv_name:
          - "{{ rubrik_db_backup_mv_name }}"
    return_content: true
    status_code: 200
  register: rubrik_db_backup_new_mv_search
  when:
    - rubrik_db_backup_mv_id is not defined
    - rubrik_db_backup_mv_created | default(false) | bool
  no_log: true

- name: Record newly created Rubrik Managed Volume ID
  ansible.builtin.set_fact:
    rubrik_db_backup_mv_id: >-
      {{
        rubrik_db_backup_new_mv_search
        .json.data.managedVolumes.nodes[0].id
      }}
  when:
    - rubrik_db_backup_mv_id is not defined
    - rubrik_db_backup_mv_created | default(false) | bool
    - rubrik_db_backup_new_mv_search is defined
    - >-
      rubrik_db_backup_new_mv_search
      .json.data.managedVolumes.nodes | length > 0

- name: Validate Rubrik Managed Volume ID
  ansible.builtin.assert:
    that:
      - rubrik_db_backup_mv_id is defined
      - rubrik_db_backup_mv_id | length > 0
    fail_msg: >-
      Rubrik Managed Volume {{ rubrik_db_backup_mv_name }}
      could not be found or created.
    success_msg: >-
      Rubrik Managed Volume {{ rubrik_db_backup_mv_name }}
      is available.

- name: Assign SLA to new Rubrik Managed Volume
  ansible.builtin.uri:
    url: "{{ rubrik_db_backup_api_url }}/graphql"
    method: POST
    headers:
      Authorization: "{{ rubrik_db_backup_bearer_token }}"
    body_format: json
    body:
      query: |
        mutation assignSLA(
          $input: UpdateManagedVolumeInput!
        ) {
          updateManagedVolume(
            input: $input
          ) {
            hostPatterns
          }
        }
      variables:
        input:
          id: "{{ rubrik_db_backup_mv_id }}"
          update:
            configuredSlaDomainId: "{{ rubrik_db_backup_sla_id }}"
    return_content: true
    status_code: 200
  when: rubrik_db_backup_mv_created | default(false) | bool
  changed_when: true
  no_log: true
