---
# Created by Adam Spandel, November 2026
# Purpose: Validates the Active Directory access policy applied
# to Rocky Linux database servers through SSSD.

- name: Read Active Directory access configuration
  ansible.builtin.command:
    cmd: realm list
  register: linux_domain_join_access
  changed_when: false

- name: Validate Active Directory login policy
  ansible.builtin.assert:
    that:
      - >-
        "allow-permitted-logins"
        in linux_domain_join_access.stdout
    fail_msg: >-
      Active Directory permitted-login policy is not active on
      {{ inventory_hostname }}.
    success_msg: >-
      Active Directory permitted-login policy is active on
      {{ inventory_hostname }}.

- name: Validate required Active Directory groups are permitted
  ansible.builtin.assert:
    that:
      - >-
        (item | lower)
        in
        (linux_domain_join_access.stdout | lower)
    fail_msg: >-
      Required Active Directory group {{ item }}
      is not permitted on {{ inventory_hostname }}.
    success_msg: >-
      Active Directory group {{ item }}
      is permitted on {{ inventory_hostname }}.
    quiet: true
  loop: "{{ linux_domain_join_permitted_groups }}"
  loop_control:
    label: "{{ item }}"
