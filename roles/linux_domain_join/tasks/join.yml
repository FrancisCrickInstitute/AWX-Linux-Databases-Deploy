---
# Created by Adam Spandel, November 2026
# Purpose: Joins a Rocky Linux database server to the Crick
# Active Directory domain using realmd and adcli.

- name: Read current Active Directory realm membership
  ansible.builtin.command:
    cmd: realm list
  register: linux_domain_join_realm_before
  changed_when: false
  failed_when: false

- name: Record whether server is already joined to Active Directory
  ansible.builtin.set_fact:
    linux_domain_join_already_joined: >-
      {{
        linux_domain_join_domain
        in linux_domain_join_realm_before.stdout
      }}

- name: Report existing Active Directory membership
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }} is already joined to
      {{ linux_domain_join_domain }}.
  when: linux_domain_join_already_joined | bool

- name: Join database server to Active Directory
  ansible.builtin.command:
    cmd: >-
      realm join
      {{ linux_domain_join_domain }}
      --user={{ linux_domain_join_admin_user }}
      --membership-software={{
        linux_domain_join_membership_software
      }}
      --computer-ou={{
        linux_domain_join_computer_ou
      }}
    stdin: "{{ linux_domain_join_admin_password }}"
  register: linux_domain_join_result
  changed_when: linux_domain_join_result.rc == 0
  when: not linux_domain_join_already_joined | bool
  no_log: true

- name: Read Active Directory realm membership after join
  ansible.builtin.command:
    cmd: realm list
  register: linux_domain_join_realm_after
  changed_when: false

- name: Validate Active Directory domain membership
  ansible.builtin.assert:
    that:
      - >-
        linux_domain_join_domain
        in linux_domain_join_realm_after.stdout
    fail_msg: >-
      {{ inventory_hostname }} is not joined to
      {{ linux_domain_join_domain }}.
    success_msg: >-
      {{ inventory_hostname }} is joined to
      {{ linux_domain_join_domain }}.
