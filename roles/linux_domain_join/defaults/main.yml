---
# Created by Adam Spandel, November 2026
# Purpose: Defines the Active Directory integration defaults used by
# Rocky Linux database servers.

linux_domain_join_domain: "thecrick.org"
linux_domain_join_realm: "THECRICK.ORG"

linux_domain_join_computer_ou: >-
  OU=Linux,OU=Servers,OU=Resources,OU=Crick,DC=thecrick,DC=org

linux_domain_join_membership_software: "adcli"

linux_domain_join_packages:
  - adcli
  - krb5-workstation
  - oddjob
  - oddjob-mkhomedir
  - realmd
  - samba-common
  - samba-common-tools
  - sssd
  - sssd-ad
  - sssd-common
  - sssd-tools

linux_domain_join_system_admin_group: >-
  DLG_Linux_Server_SystemAdmin_sudo_Access_Granted@thecrick.org

linux_domain_join_database_admin_group: >-
  DLG_Linux_Server_Database_Admin_Access_Granted@thecrick.org

linux_domain_join_permitted_groups:
  - "{{ linux_domain_join_system_admin_group }}"
  - "{{ linux_domain_join_database_admin_group }}"

linux_domain_join_use_fully_qualified_names: false
linux_domain_join_fallback_homedir: "/home/%u"
linux_domain_join_default_shell: "/bin/bash"

linux_domain_join_ldap_id_mapping: false
linux_domain_join_cache_credentials: true
linux_domain_join_krb5_store_password_if_offline: true

linux_domain_join_sssd_config_path: "/etc/sssd/sssd.conf"
linux_domain_join_sssd_config_mode: "0640"
