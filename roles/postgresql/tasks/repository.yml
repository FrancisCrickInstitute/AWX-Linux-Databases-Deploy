---
# Created by Adam Spandel, October 2026
# Purpose: Configures the official PostgreSQL PGDG repository for Rocky Linux 10+.
# Provides access to PostgreSQL 18 packages that are not included in the
# standard Rocky Linux 10 repositories.

- name: Install PostgreSQL PGDG repository
  ansible.builtin.dnf:
    name: >-
      https://download.postgresql.org/pub/repos/yum/reporpms/EL-10-x86_64/pgdg-redhat-repo-latest.noarch.rpm
    state: present
    disable_gpg_check: true

- name: Refresh DNF metadata after adding PostgreSQL repository
  ansible.builtin.dnf:
    update_cache: true
