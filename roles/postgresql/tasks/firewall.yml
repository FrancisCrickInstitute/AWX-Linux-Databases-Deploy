# Created by Adam Spandel, October 2026
# Purpose: Configures the host firewall for PostgreSQL.
# Ensures firewalld is enabled and allows PostgreSQL client connections
# through the standard PostgreSQL firewalld service.

- name: Ensure firewalld is enabled and running
  ansible.builtin.systemd_service:
    name: firewalld
    enabled: true
    state: started

- name: Allow PostgreSQL through firewalld
  ansible.posix.firewalld:
    service: postgresql
    permanent: true
    immediate: true
    state: enabled
